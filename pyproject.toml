[project]
name = "aide"
version = "0.1.0"
description = "AI Data Engineer — contract kernel"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "duckdb>=1.2,<2",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2,<3",
    "sqlglot>=26.0.0,<27",
    "snowflake-connector-python>=3.12,<4",
    "cryptography>=44.0.0,<47",
    "typer>=0.15,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "hypothesis>=6.122.0",
    "import-linter>=2.1",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
aide = "aide.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aide", "synthetic"]
force-include = { "src/aide/prompts" = "aide/prompts" }

[tool.hatch.build.targets.wheel.sources]
"src/aide" = "aide"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "hypothesis>=6.122.0",
    "import-linter>=2.1",
    "httpx>=0.28,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP042"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["aide"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["sqlglot", "sqlglot.*", "duckdb", "duckdb.*", "snowflake", "snowflake.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "snowflake_live: live Snowflake tests skipped when credentials are absent",
]

[tool.importlinter]
root_packages = ["aide"]

[[tool.importlinter.contracts]]
name = "Layered modular monolith"
type = "layers"
layers = [
    "aide.api | aide.cli",
    "aide.app",
    "aide.orchestration",
    "aide.modelling",
    "aide.tools | aide.persistence | aide.approvals | aide.quality | aide.discovery | aide.profiling",
    "aide.policy | aide.reasoning",
    "aide.capabilities | aide.connectors.base | aide.secrets | aide.auth | aide.llm",
    "aide.domain",
]

[[tool.importlinter.contracts]]
name = "Domain imports no project packages"
type = "forbidden"
source_modules = ["aide.domain"]
forbidden_modules = [
    "aide.capabilities",
    "aide.connectors",
    "aide.policy",
    "aide.approvals",
    "aide.secrets",
    "aide.auth",
]

[[tool.importlinter.contracts]]
name = "Persistence never imports orchestration"
type = "forbidden"
source_modules = ["aide.persistence"]
forbidden_modules = ["aide.orchestration"]

[[tool.importlinter.contracts]]
name = "Capability and connector contracts stay below policy"
type = "forbidden"
source_modules = [
    "aide.capabilities",
    "aide.connectors.base",
]
forbidden_modules = [
    "aide.policy",
    "aide.approvals",
    "aide.auth",
]

[[tool.importlinter.contracts]]
name = "Policy never imports approvals, auth, or tools"
type = "forbidden"
source_modules = ["aide.policy"]
forbidden_modules = [
    "aide.approvals",
    "aide.auth",
    "aide.tools",
    "aide.orchestration",
    "aide.llm",
]

[[tool.importlinter.contracts]]
name = "Secrets contracts stay below policy and approvals"
type = "forbidden"
source_modules = ["aide.secrets"]
forbidden_modules = [
    "aide.policy",
    "aide.approvals",
    "aide.auth",
    "aide.capabilities",
    "aide.connectors",
]

[[tool.importlinter.contracts]]
name = "Auth contracts stay below policy and approvals"
type = "forbidden"
source_modules = ["aide.auth"]
forbidden_modules = [
    "aide.policy",
    "aide.approvals",
    "aide.capabilities",
    "aide.connectors",
    "aide.secrets",
]

[[tool.importlinter.contracts]]
name = "API never imports persistence, connectors, tools, or LLM"
type = "forbidden"
source_modules = ["aide.api"]
forbidden_modules = [
    "aide.persistence",
    "aide.connectors",
    "aide.tools",
    "aide.llm",
    "aide.orchestration",
]

[[tool.importlinter.contracts]]
name = "Orchestration never imports vendor connectors or LLM providers"
type = "forbidden"
source_modules = ["aide.orchestration"]
forbidden_modules = [
    "aide.connectors.snowflake",
    "aide.llm",
    "aide.api",
    "aide.cli",
]
