<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Data Pilot AI operator console{% endblock %}</title>
  {% block head %}{% endblock %}
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font: 16px/1.45 system-ui, sans-serif; color: #1c2430; background: #f4f6f8; }
    header, main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    h1 { font-size: 1.4rem; margin: 0; }
    h2 { font-size: 1.1rem; margin: 1.4rem 0 0.4rem; }
    a { color: #0b4f8a; }
    button, .button { background: #0b4f8a; color: #fff; border: 0; border-radius: 6px; padding: 10px 14px; font: inherit; cursor: pointer; }
    button.secondary { background: #5c6770; }
    form.inline { display: inline; }
    .banner { background: #fff8e8; border: 1px solid #e2c57a; padding: 12px; border-radius: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .card { background: #fff; border: 1px solid #d5dde6; border-radius: 8px; padding: 12px; }
    .label { color: #5c6770; font-size: 0.85rem; }
    .status { font-weight: 650; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { border: 1px solid #d5dde6; padding: 6px 8px; text-align: left; vertical-align: top; }
    .scroll { overflow-x: auto; }
    pre { white-space: pre-wrap; word-break: break-word; background: #fff; border: 1px solid #d5dde6; padding: 12px; border-radius: 8px; }
    .error { color: #8d1d1d; }
    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      button, .button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Operator console</h1>
      <div class="label">Synthetic Interview scenario only</div>
    </div>
    {% block header_actions %}{% endblock %}
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
