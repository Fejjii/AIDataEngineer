title = "AIDataEngineer gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Deterministic offline test fixture token assignment"
paths = ['''tests/security/test_leakage\.py''']
regexTarget = "match"
regexes = ['''token = "opaque-session-token"''']

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Superseded R1 CI fixture literals in workflow/report commits only"
commits = [
  "91dfbd170a11d02f95a2ee14fbf6df984327dc0f",
  "e064e891d34a0fc1af88bf3ca06dd4f603ee4170",
]
paths = ['''\.github/workflows/ci\.yml''', '''docs/agent/runs/DE003/DE003-SESSION-20260912T093000Z-bc01a094\.md''']
regexTarget = "line"
condition = "AND"
regexes = ['''ci-smoke-csrf-secret-at-least-32-characters-long|ci-smoke-password-not-a-production-secret''']

[[rules.allowlists]]
description = "Historical hex placeholder token=abcdef123456; working tree no longer contains it"
commits = [
  "5555da6218d8bc4079afaf1c1c3d8ef037aa0ced",
  "2ef9b20a411594c7159bdda1696f26033190f4ef",
]
paths = [
  '''tests/connectors/contract/test_dbt_workspace\.py''',
  '''docs/agent/runs/DE007/DE007-SESSION-20260912T185800Z-bc01a096\.md''',
]
regexTarget = "match"
condition = "AND"
regexes = ['''abcdef123456''']
