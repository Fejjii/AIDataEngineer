name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked toolchain
        run: uv sync --frozen --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy strict
        run: uv run mypy src tests asgi.py

      - name: Import linter
        run: uv run lint-imports

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --verbose

  test:
    name: Tests and migrations
    runs-on: ubuntu-latest
    env:
      AIDE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/aide_dev
      AIDE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/aide_dev
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aide_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aide_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked toolchain
        run: uv sync --frozen --all-groups

      - name: Alembic upgrade validation
        run: uv run alembic upgrade head

      - name: Alembic drift check
        run: uv run alembic check

      - name: Pytest full suite
        run: uv run pytest

      - name: Pytest PostgreSQL integration
        run: uv run pytest tests/integration

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: aide_dev
      POSTGRES_USER: aide_ci
      POSTGRES_PASSWORD: ci-smoke-password-not-a-production-secret
      POSTGRES_PORT: 5432
      AIDE_HTTP_PORT: 8000
      AIDE_CSRF_SECRET: ci-smoke-csrf-secret-at-least-32-characters-long
      COMPOSE_PROJECT_NAME: aide-ci-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image and smoke-test Docker Compose stack
        run: |
          chmod +x scripts/ci_compose_smoke.sh
          ./scripts/ci_compose_smoke.sh
