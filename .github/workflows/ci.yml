name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/DE002A_contract_kernel

jobs:
  contract-kernel:
    name: DE 002B persistence and recovery kernel
    runs-on: ubuntu-latest
    env:
      AIDE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/aide_dev
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aide_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aide_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked toolchain
        run: uv sync --frozen --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy strict
        run: uv run mypy src tests

      - name: Import linter
        run: uv run lint-imports

      - name: Pytest unit, property, and documentation contracts
        run: uv run pytest
